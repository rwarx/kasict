name: Update Schedule Data

on:
  schedule:
    # Проверка каждые 30 минут (на не круглых минутах — GitHub задерживает
    # запуски ровно в :00 из-за пиков нагрузки)
    - cron: '7,37 * * * *'
  workflow_dispatch: # Ручной запуск
  push:
    paths:
      - 'scripts/generate_data.py'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate schedule data
        run: python scripts/generate_data.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update schedule data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push ботовым GITHUB_TOKEN не триггерит другие workflows — деплой запускаем явно
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
