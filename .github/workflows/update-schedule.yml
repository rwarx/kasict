name: Update Schedule Data

on:
  schedule:
    # Обновление каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ручной запуск
  push:
    paths:
      - 'scripts/generate_data.py'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml pydantic pydantic-settings

      - name: Generate schedule data
        run: python scripts/generate_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git diff --staged --quiet || git commit -m "chore: update schedule data [skip ci]"
          git push
