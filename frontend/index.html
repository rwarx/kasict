<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#F4F4F1" />
    <meta name="description" content="Расписание колледжа с автоматическим учётом замен" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Расписание" />
    <title>Расписание колледжа</title>
    <script>
      // Ранняя установка темы и сезона — до загрузки бандла (без вспышки темы)
      ;(function () {
        try {
          var p = localStorage.getItem('schedule:theme')
          if (p !== 'light' && p !== 'dark') {
            p = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          var s = new URLSearchParams(location.search).get('season')
          if (!/^(winter|spring|summer|autumn)$/.test(s || '')) {
            var m = new Date().getMonth()
            s = (m <= 1 || m === 11) ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn'
          }
          var root = document.documentElement
          root.dataset.theme = p
          root.dataset.season = s
          root.style.colorScheme = p
          // Сезонные иконки PWA: манифест + favicon + apple-touch-icon под текущий сезон
          var ml = document.querySelector('link[rel="manifest"]')
          if (ml) ml.setAttribute('href', './manifest-' + s + '.webmanifest')
          var il = document.querySelector('link[rel="icon"]')
          if (il) il.setAttribute('href', './icons/icon-192-' + s + '.png')
          var al = document.querySelector('link[rel="apple-touch-icon"]')
          if (al) al.setAttribute('href', './icons/icon-192-' + s + '.png')
        } catch (e) { /* noop */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
